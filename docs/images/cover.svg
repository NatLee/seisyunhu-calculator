<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="1600" height="800" role="img" aria-labelledby="title desc"><title id="title">Seisyunhu — A whole-hour price calculator</title><desc id="desc">Editable flat project cover. Existing demo assets are embedded and framed; their source files remain unchanged.</desc><style>text{font-family:"Segoe UI","Microsoft JhengHei","Noto Sans",Arial,sans-serif}</style><rect x="0" y="0" width="1600" height="800" fill="#fafbf8" stroke="none" rx="0"/><text x="72" y="78" font-size="17" fill="#815162" font-weight="650" font-family="sans-serif" letter-spacing="2">KARAOKE CALCULATOR / 2021 ARCHIVE</text><line x1="72" y1="112" x2="1528" y2="112" stroke="#d7ddd4" stroke-width="2" /><text x="68" y="245" font-size="94" fill="#202721" font-weight="650" font-family="sans-serif" letter-spacing="-3">Seisyunhu</text><text x="72" y="353" font-size="27" fill="#67716b" font-weight="400" font-family="sans-serif" >A whole-hour price calculator</text><text x="72" y="393" font-size="27" fill="#67716b" font-weight="400" font-family="sans-serif" >using historical rates.</text><line x1="72" y1="567" x2="712" y2="567" stroke="#d7ddd4" stroke-width="2" /><rect x="72" y="597" width="5" height="5" fill="#815162" stroke="none" rx="0"/><text x="91" y="605" font-size="18" fill="#67716b" font-weight="400" font-family="sans-serif" >Static HTML + JavaScript</text><rect x="72" y="635" width="5" height="5" fill="#815162" stroke="none" rx="0"/><text x="91" y="643" font-size="18" fill="#67716b" font-weight="400" font-family="sans-serif" >Historical pricing</text><line x1="72" y1="695" x2="1528" y2="695" stroke="#d7ddd4" stroke-width="2" /><text x="72" y="741" font-size="17" fill="#67716b" font-weight="400" font-family="monospace" >seisyunhu-calculator</text><text x="1190" y="741" font-size="15" fill="#67716b" font-weight="400" font-family="sans-serif" letter-spacing="1">PROJECT NOTES / NATLEE</text><rect x="896" y="158" width="584" height="510" fill="#ffffff" stroke="#d7ddd4" rx="5"/><text x="932" y="206" font-size="17" fill="#815162" font-weight="650" font-family="sans-serif" >2021 / HISTORICAL RATE EXAMPLE</text><line x1="932" y1="230" x2="1444" y2="230" stroke="#d7ddd4" stroke-width="2" /><text x="932" y="279" font-size="23" fill="#202721" font-weight="600" font-family="sans-serif" >Weekday / CROSSO or G5000</text><text x="932" y="326" font-size="22" fill="#67716b" font-weight="400" font-family="sans-serif" >3 people     12:00 → 18:00</text><text x="932" y="378" font-size="22" fill="#67716b" font-weight="400" font-family="sans-serif" >6 hours × NT$ 230</text><line x1="932" y1="414" x2="1444" y2="414" stroke="#d7ddd4" stroke-width="2" /><text x="932" y="476" font-size="55" fill="#202721" font-weight="650" font-family="sans-serif" >NT$ 1,380</text><text x="932" y="524" font-size="22" fill="#67716b" font-weight="400" font-family="sans-serif" >NT$ 460 / person</text><line x1="932" y1="561" x2="1444" y2="561" stroke="#d7ddd4" stroke-width="2" /><text x="932" y="613" font-size="18" fill="#815162" font-weight="400" font-family="sans-serif" >Historical rates. Confirm current venue prices.</text></svg>
