<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 350" role="img" aria-labelledby="title desc"><title id="title">Historical karaoke pricing · calculation flow</title><desc id="desc">Form inputs → Validate → Price components → Bill estimate. Uses the original 2021 rates. Current prices must be confirmed with the venue.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#38bdf8" stroke-width="1.5"/></marker></defs><rect width="1280" height="350" rx="20" fill="#101c30"/><g font-family="Segoe UI,Arial,sans-serif"><text x="60" y="58" fill="#f8fafc" font-size="25" font-weight="700">Historical karaoke pricing · calculation flow</text><path d="M330.5 175 H351.5" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/><rect x="60.0" y="103" width="270.5" height="145" rx="14" fill="#1b2d48" stroke="#355273"/><text x="78.0" y="132" fill="#38bdf8" font-size="13" font-weight="700">01</text><text x="78.0" y="164" fill="#f8fafc" font-size="18" font-weight="600">Form inputs</text><text x="78.0" y="193" fill="#cbd5e1" font-size="14">People / day / room</text><text x="78.0" y="215" fill="#cbd5e1" font-size="14">Whole-hour times</text><path d="M627.0 175 H648.0" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/><rect x="356.5" y="103" width="270.5" height="145" rx="14" fill="#1b2d48" stroke="#355273"/><text x="374.5" y="132" fill="#38bdf8" font-size="13" font-weight="700">02</text><text x="374.5" y="164" fill="#f8fafc" font-size="18" font-weight="600">Validate</text><text x="374.5" y="193" fill="#cbd5e1" font-size="14">Same-day session</text><text x="374.5" y="215" fill="#cbd5e1" font-size="14">Finite valid values</text><path d="M923.5 175 H944.5" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/><rect x="653.0" y="103" width="270.5" height="145" rx="14" fill="#1b2d48" stroke="#355273"/><text x="671.0" y="132" fill="#38bdf8" font-size="13" font-weight="700">03</text><text x="671.0" y="164" fill="#f8fafc" font-size="18" font-weight="600">Price components</text><text x="671.0" y="193" fill="#cbd5e1" font-size="14">Morning package</text><text x="671.0" y="215" fill="#cbd5e1" font-size="14">Regular + extra</text><rect x="949.5" y="103" width="270.5" height="145" rx="14" fill="#1b2d48" stroke="#355273"/><text x="967.5" y="132" fill="#38bdf8" font-size="13" font-weight="700">04</text><text x="967.5" y="164" fill="#f8fafc" font-size="18" font-weight="600">Bill estimate</text><text x="967.5" y="193" fill="#cbd5e1" font-size="14">Cap regular discount</text><text x="967.5" y="215" fill="#cbd5e1" font-size="14">Total / per person</text><text x="60" y="298" fill="#b4c9dd" font-size="16">Uses the original 2021 rates. Current prices must be confirmed with the venue.</text></g></svg>
